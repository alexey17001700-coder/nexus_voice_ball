<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>Живой режим — Wlupidol</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070f;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    touch-action:none;user-select:none}

  /* ---------- СТАРТ ---------- */
  #start{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;z-index:20;
    background:radial-gradient(circle at 50% 42%,#0d1a33 0%,#05070f 70%)}
  #micBtn{width:150px;height:150px;border-radius:50%;border:none;cursor:pointer;
    font-size:62px;line-height:1;color:#eaf6ff;
    background:radial-gradient(circle at 35% 30%,#4aa8ff,#1b4fd8 60%,#0b2a7a);
    box-shadow:0 0 0 1px rgba(120,190,255,.45),0 0 40px rgba(60,140,255,.55),
      inset 0 -8px 24px rgba(0,0,0,.35);
    animation:pulse 2.6s ease-in-out infinite;transition:transform .15s}
  #micBtn:active{transform:scale(.94)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 1px rgba(120,190,255,.45),0 0 34px rgba(60,140,255,.45),inset 0 -8px 24px rgba(0,0,0,.35)}
    50%{box-shadow:0 0 0 1px rgba(150,210,255,.6),0 0 62px rgba(80,170,255,.75),inset 0 -8px 24px rgba(0,0,0,.35)}}
  #start p{color:#7fa3cc;font-size:15px;letter-spacing:.4px;text-align:center;padding:0 30px}
  #start small{color:#4d6b90;font-size:12px;letter-spacing:.3px}

  /* ---------- СЦЕНА ---------- */
  #stage{position:fixed;inset:0;display:none;z-index:10;
    background:radial-gradient(circle at 50% 45%,#0a1428 0%,#04060d 72%)}
  #stage.on{display:block}
  canvas{position:absolute;inset:0;display:block}

  #status{position:absolute;top:calc(env(safe-area-inset-top,0px) + 26px);left:0;right:0;
    text-align:center;color:#9dc4ee;font-size:14px;letter-spacing:2.4px;
    text-transform:uppercase;text-shadow:0 0 14px rgba(80,160,255,.7);
    pointer-events:none;transition:color .3s}

  #back{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
    width:min(78%,360px);padding:16px 0;border-radius:16px;cursor:pointer;
    border:1px solid rgba(120,180,255,.35);color:#cfe6ff;font-size:16px;
    letter-spacing:1.2px;background:rgba(20,40,80,.55);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:0 0 24px rgba(50,120,255,.25),inset 0 1px 0 rgba(160,210,255,.18)}
  #back:active{background:rgba(35,70,130,.75)}
</style>
</head>
<body>

<div id="start">
  <button id="micBtn">🎤</button>
  <p>Нажми микрофон — откроется живое общение</p>
  <small>Говори — шар отзовётся на голос</small>
</div>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="status">слушаю вас</div>
  <button id="back">← назад</button>
</div>

<script>
(function(){
"use strict";

/* ============ КАНВАС ============ */
var cv = document.getElementById('c');
var ctx = cv.getContext('2d', {alpha:true});
var W = 0, H = 0, DPR = 1;

/* бюджет пикселей: не даём канвасу разрастаться — иначе зависает
   при сильном расширении окна и при зуме */
var MAX_PIX = 1800000;      // ~1.8 млн точек рисования
var MAX_DPR = 2;

function resize(){
  var w = window.innerWidth  || document.documentElement.clientWidth  || 360;
  var h = window.innerHeight || document.documentElement.clientHeight || 640;
  if (w < 50) w = 360;
  if (h < 50) h = 640;

  var dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
  /* пикселей слишком много — снижаем плотность, картинка мягче, но не виснет */
  var need = w * h * dpr * dpr;
  if (need > MAX_PIX) dpr = Math.max(1, dpr * Math.sqrt(MAX_PIX / need));

  /* размер не изменился — не пересобираем канвас зря */
  if (w === W && h === H && dpr === DPR && cv.width) return;

  W = w; H = h; DPR = dpr;
  cv.width  = Math.floor(w * dpr);
  cv.height = Math.floor(h * dpr);
  cv.style.width  = w + 'px';
  cv.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* тормоз: при растягивании/зуме событие летит десятками в секунду —
   пересобираем канвас один раз, а не на каждое событие */
var rzT = 0;
function resizeSoon(){
  if (rzT) clearTimeout(rzT);
  rzT = setTimeout(function(){ rzT = 0; resize(); }, 180);
}
window.addEventListener('resize', resizeSoon);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 250); });
resize();

/* ============ ТОЧКИ НА СФЕРЕ ============ */
var N = 900;
var pts = [];
var GA = Math.PI * (3 - Math.sqrt(5));
for (var i = 0; i < N; i++){
  var y  = 1 - (i / (N - 1)) * 2;
  var rr = Math.sqrt(Math.max(0, 1 - y*y));
  var th = i * GA;
  pts.push({
    x: Math.cos(th) * rr,
    y: y,
    z: Math.sin(th) * rr,
    ph: Math.random() * Math.PI * 2,
    sp: 0.55 + Math.random() * 1.5
  });
}

/* ============ СПРАЙТЫ СВЕЧЕНИЯ (кэш) ============ */
function makeGlow(size, r, g, b, a){
  var c = document.createElement('canvas');
  c.width = c.height = size;
  var x = c.getContext('2d');
  var gr = x.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  gr.addColorStop(0,   'rgba('+r+','+g+','+b+','+a+')');
  gr.addColorStop(0.45,'rgba('+r+','+g+','+b+','+(a*0.35)+')');
  gr.addColorStop(1,   'rgba('+r+','+g+','+b+',0)');
  x.fillStyle = gr;
  x.fillRect(0, 0, size, size);
  return c;
}

/* разноцветное ядро: мягкие цветные пятна по кругу + белый центр */
function makeRainbowGlow(size, a){
  var c = document.createElement('canvas');
  c.width = c.height = size;
  var x = c.getContext('2d');
  x.globalCompositeOperation = 'lighter';
  var cx = size / 2, cy = size / 2;
  var hues = [200, 232, 266, 300, 332, 24];
  for (var i = 0; i < hues.length; i++){
    var ang = (i / hues.length) * Math.PI * 2;
    var ox = cx + Math.cos(ang) * size * 0.17;
    var oy = cy + Math.sin(ang) * size * 0.17;
    var rr = size * 0.34;
    var g = x.createRadialGradient(ox, oy, 0, ox, oy, rr);
    g.addColorStop(0,    'hsla(' + hues[i] + ',100%,62%,' + (a * 0.55) + ')');
    g.addColorStop(0.45, 'hsla(' + hues[i] + ',100%,55%,' + (a * 0.22) + ')');
    g.addColorStop(1,    'hsla(' + hues[i] + ',100%,50%,0)');
    x.fillStyle = g;
    x.beginPath();
    x.arc(ox, oy, rr, 0, 6.2832);
    x.fill();
  }
  var gc = x.createRadialGradient(cx, cy, 0, cx, cy, size * 0.30);
  gc.addColorStop(0,   'rgba(255,255,255,' + (a * 0.85) + ')');
  gc.addColorStop(0.4, 'rgba(220,240,255,' + (a * 0.30) + ')');
  gc.addColorStop(1,   'rgba(200,230,255,0)');
  x.fillStyle = gc;
  x.beginPath();
  x.arc(cx, cy, size * 0.30, 0, 6.2832);
  x.fill();
  return c;
}
var HALO = makeGlow(256, 60, 140, 255, 0.55);
var CORE = makeRainbowGlow(256, 0.85);

/* ============ НЕЙРОННЫЕ СВЯЗИ ============ */
var NEURONS = [];
var NEU_N = 16;
for (var n = 0; n < NEU_N; n++){
  /* направление на сфере — линии расходятся объёмно, как шар */
  var uu = Math.random() * 2 - 1;
  var th = Math.acos(Math.max(-1, Math.min(1, uu)));
  var ph = Math.random() * Math.PI * 2;
  var dx = Math.sin(th) * Math.cos(ph);
  var dy = Math.cos(th);
  var dz = Math.sin(th) * Math.sin(ph);

  /* базис-перпендикуляры к направлению — для изгибов в 3D */
  var ax = 0, ay = 1, az = 0;
  if (Math.abs(dy) > 0.9){ ax = 1; ay = 0; az = 0; }
  var e1x = dy * az - dz * ay, e1y = dz * ax - dx * az, e1z = dx * ay - dy * ax;
  var e1l = Math.sqrt(e1x * e1x + e1y * e1y + e1z * e1z) || 1;
  e1x /= e1l; e1y /= e1l; e1z /= e1l;
  var e2x = dy * e1z - dz * e1y, e2y = dz * e1x - dx * e1z, e2z = dx * e1y - dy * e1x;

  /* ответвления: 1-2 у каждого, у части — ветка второго порядка */
  var nb = 1 + ((Math.random() * 2) | 0);
  var brs = [];
  for (var nb2 = 0; nb2 < nb; nb2++){
    brs.push({
      at:   0.38 + Math.random() * 0.42,          // где сидит на стволе (0..1)
      side: Math.random() < 0.5 ? 1 : -1,         // в какую сторону уходит
      bang: Math.random() * Math.PI * 2,          // куда крутится в 3D
      len:  0.28 + Math.random() * 0.34,          // длина в долях L
      bend: (Math.random() * 2 - 1) * 0.95,       // изгиб
      sub:  Math.random() < 0.55                  // ветка второго порядка
    });
  }
  /* бегущие точки-сигналы: 2-4 на нейрон */
  var sig = [];
  var nsig = 2 + ((Math.random() * 3) | 0);
  for (var s2 = 0; s2 < nsig; s2++){
    sig.push({
      u:  Math.random(),                          // 0 = центр, 1 = конец
      sp: 0.16 + Math.random() * 0.26,            // скорость
      br:  (brs.length && Math.random() < 0.45) ? ((Math.random() * brs.length) | 0) : -1
    });
  }
  NEURONS.push({
    dx: dx, dy: dy, dz: dz,                       // направление на сфере
    e1: [e1x, e1y, e1z],                          // перпендикуляр 1
    e2: [e2x, e2y, e2z],                          // перпендикуляр 2
    len:    0.80 + Math.random() * 0.80,          // длина в долях R
    bend:   (Math.random() * 2 - 1) * 0.60,       // изгиб кривой
    ph:     Math.random() * Math.PI * 2,
    ph2:    Math.random() * Math.PI * 2,
    drift:  (Math.random() * 2 - 1) * 0.075,      // своя скорость вращения
    sp:     0.45 + Math.random() * 0.95,
    hue:    196 + Math.random() * 140,            // синий -> фиолетовый -> розовый
    w:      1.00 + Math.random() * 1.25,          // потолще
    brs:    brs,
    sig:    sig
  });
}

/* ============ 3D-МАТЕМАТИКА ============ */
/* поворот точки вокруг Y, затем наклон вокруг X */
function rot3(x, y, z, cosY, sinY, ct, st){
  var x1 =  x * cosY + z * sinY;
  var z1 = -x * sinY + z * cosY;
  var y2 = y * ct - z1 * st;
  var z2 = y * st + z1 * ct;
  return [x1, y2, z2];
}
/* проекция на экран: дальние короче — отсюда объём */
function proj3(v, cx, cy, R){
  var persp = 1 + v[2] * 0.26;
  return [cx + v[0] * R * persp, cy + v[1] * R * persp, v[2], persp];
}
/* точка на квадратичной кривой Безье в 3D (u = 0..1) */
function qpt3(a, b, c, u){
  var m = 1 - u;
  return [
    m * m * a[0] + 2 * m * u * b[0] + u * u * c[0],
    m * m * a[1] + 2 * m * u * b[1] + u * u * c[1],
    m * m * a[2] + 2 * m * u * b[2] + u * u * c[2]
  ];
}
/* направление ответвления в 3D */
function brDir(bang, side, dx, dy, dz, e1x, e1y, e1z, e2x, e2y, e2z){
  var cb = Math.cos(bang), sb = Math.sin(bang);
  var vx = dx * 0.30 + (e1x * cb + e2x * sb) * side;
  var vy = dy * 0.30 + (e1y * cb + e2y * sb) * side;
  var vz = dz * 0.30 + (e1z * cb + e2z * sb) * side;
  var vl = Math.sqrt(vx * vx + vy * vy + vz * vz) || 1;
  return [vx / vl, vy / vl, vz / vl];
}
/* кривая ответвления: [конец, контрольная точка] */
function brCurve(s3, bd, bl, e2x, e2y, e2z, bend){
  var e3 = [s3[0] + bd[0] * bl, s3[1] + bd[1] * bl, s3[2] + bd[2] * bl];
  var m3 = [
    (s3[0] + e3[0]) / 2 + e2x * bl * 0.35 * bend,
    (s3[1] + e3[1]) / 2 + e2y * bl * 0.35 * bend,
    (s3[2] + e3[2]) / 2 + e2z * bl * 0.35 * bend
  ];
  return [e3, m3];
}

/* ============ МОЛНИИ ============ */
/* точки вдоль кривой со смещением в стороны — волнистая молния.
   концы закреплены, джиттер живой и меняется во времени */
function boltPts(p0, c1, p2, e1x, e1y, e1z, e2x, e2y, e2z, seed, t, amp, nseg){
  var arr = [];
  for (var i = 0; i <= nseg; i++){
    var u = i / nseg;
    var q = qpt3(p0, c1, p2, u);
    var env = Math.sin(u * Math.PI);                 // 0 на концах, 1 в середине
    var a = amp * env;
    var o1 = a * (Math.sin(u *  9.0 + seed *  3.1 + t *  5.5) * 0.55
                + Math.sin(u * 21.0 + seed *  7.7 - t *  8.3) * 0.30
                + Math.sin(u * 37.0 + seed * 11.3 + t * 12.7) * 0.15);
    var o2 = a * (Math.sin(u * 13.0 + seed *  5.3 - t *  6.9) * 0.60
                + Math.sin(u * 29.0 + seed *  9.1 + t * 10.1) * 0.40);
    arr.push([
      q[0] + e1x * o1 + e2x * o2,
      q[1] + e1y * o1 + e2y * o2,
      q[2] + e1z * o1 + e2z * o2
    ]);
  }
  return arr;
}
/* точка на ломаной молнии по параметру u (0..1) */
function boltAt(arr, u){
  var n = arr.length - 1;
  var f = Math.max(0, Math.min(0.9999, u)) * n;
  var i = f | 0;
  var k = f - i;
  var a = arr[i], b = arr[i + 1] || arr[i];
  return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
}
/* рисуем молнию: ломаная в 3D -> экран, проходы = мягкое свечение без граней */
function strokeBolt(p3, cosY, sinY, ct, st, cx, cy, R, hue, alpha, w, flick, npass){
  var n = p3.length;
  var sx = [], sy = [];
  for (var i = 0; i < n; i++){
    var P = proj3(rot3(p3[i][0], p3[i][1], p3[i][2], cosY, sinY, ct, st), cx, cy, R);
    sx.push(P[0]); sy.push(P[1]);
  }
  var widths = [w * 7.0, w * 3.0, w * 1.15];
  var alphas = [alpha * 0.10, alpha * 0.28, alpha * 0.90];
  var ligs   = [68, 76, 94];
  var cnt = npass || 3;
  for (var k = 0; k < cnt; k++){
    ctx.strokeStyle = 'hsla(' + hue + ',100%,' + ligs[k] + '%,' + (alphas[k] * flick).toFixed(3) + ')';
    ctx.lineWidth   = widths[k];
    ctx.beginPath();
    ctx.moveTo(sx[0], sy[0]);
    for (var i2 = 1; i2 < n; i2++) ctx.lineTo(sx[i2], sy[i2]);
    ctx.stroke();
  }
}

/* кривые-нейроны от центра: объёмный шар, молнии, без чётких граней */
function drawNeurons(cx, cy, R, t, vis, cosY, sinY, ct, st){
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (var i = 0; i < NEURONS.length; i++){
    var nn = NEURONS[i];

    /* --- своя жизнь: у каждой линии свой дрейф и своё покачивание --- */
    var ca = Math.cos(nn.ph + t * nn.drift);
    var sa = Math.sin(nn.ph + t * nn.drift);
    var dy = nn.dy + 0.10 * Math.sin(t * nn.sp + nn.ph2);
    var dx = nn.dx * ca + nn.dz * sa;
    var dz = -nn.dx * sa + nn.dz * ca;
    var dl = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
    dx /= dl; dy /= dl; dz /= dl;

    /* перпендикуляры поворачиваем вместе с линией */
    var e1x = nn.e1[0] * ca + nn.e1[2] * sa;
    var e1z = -nn.e1[0] * sa + nn.e1[2] * ca;
    var e1y = nn.e1[1];
    var e2x = nn.e2[0] * ca + nn.e2[2] * sa;
    var e2z = -nn.e2[0] * sa + nn.e2[2] * ca;
    var e2y = nn.e2[1];

    var pulse = 0.55 + 0.45 * Math.sin(t * nn.sp * 1.6 + nn.ph);
    var grow  = 0.55 + vis * 0.80;
    var L     = nn.len * (0.50 + grow * 0.80);      // в долях R
    var r0    = 0.20;

    /* --- 3D-каркас линии: центр -> конец, изгиб в перпендикуляре --- */
    var p0 = [dx * r0, dy * r0, dz * r0];
    var p2 = [dx * (r0 + L), dy * (r0 + L), dz * (r0 + L)];
    var bnd = L * 0.42 * nn.bend;
    var c1 = [
      dx * (r0 + L * 0.55) + e1x * bnd,
      dy * (r0 + L * 0.55) + e1y * bnd,
      dz * (r0 + L * 0.55) + e1z * bnd
    ];

    /* проекция на экран: дальние короче и тусклее — отсюда объём */
    var P0 = proj3(rot3(p0[0], p0[1], p0[2], cosY, sinY, ct, st), cx, cy, R);
    var P1 = proj3(rot3(c1[0], c1[1], c1[2], cosY, sinY, ct, st), cx, cy, R);
    var P2 = proj3(rot3(p2[0], p2[1], p2[2], cosY, sinY, ct, st), cx, cy, R);

    var dep = 0.38 + 0.62 * ((P2[2] + 1) * 0.5);    // 0 = сзади, 1 = спереди
    var ws  = 0.70 + 0.55 * ((P2[2] + 1) * 0.5);    // толщина по глубине

    var alpha = (0.09 + vis * 0.40) * pulse * dep;
    var hue   = nn.hue.toFixed(0);

    /* мерцание молнии: своё у каждой линии + редкие вспышки */
    var flick = 0.62 + 0.38 * Math.abs(Math.sin(t * 13.0 + nn.ph * 5.0));
    if (Math.sin(t * 2.7 + nn.ph * 3.3) > 0.94) flick = 1.45;

    /* ответвления растут от голоса/шума */
    var bg = 0.12 + vis * 1.15;
    var bamp = L * (0.10 + 0.16 * vis);        // амплитуда волны молнии

    /* --- ствол: волнистая молния от центра --- */
    var mainBolt = boltPts(p0, c1, p2, e1x, e1y, e1z, e2x, e2y, e2z,
                           nn.ph, t, bamp, 12);
    strokeBolt(mainBolt, cosY, sinY, ct, st, cx, cy, R,
               hue, alpha, nn.w * ws, flick, 3);

    /* молнии ответвлений — считаем заранее, чтобы сигналы шли по ним */
    var brBolts = [];
    for (var bi0 = 0; bi0 < nn.brs.length; bi0++){
      var b0 = nn.brs[bi0];
      var s30 = qpt3(p0, c1, p2, b0.at);
      var bd0 = brDir(b0.bang, b0.side, dx, dy, dz, e1x, e1y, e1z, e2x, e2y, e2z);
      var bl0 = L * b0.len * bg;
      var bc0 = brCurve(s30, bd0, bl0, e2x, e2y, e2z, b0.bend);
      brBolts.push(boltPts(s30, bc0[1], bc0[0], e1x, e1y, e1z, e2x, e2y, e2z,
                           b0.bang, t, bl0 * (0.12 + 0.18 * vis), 8));
    }

    /* точка сигнала в 3D: на стволе или на ответвлении */
    var sigPt3 = function(sg, u){
      if (sg.br >= 0 && brBolts[sg.br]) return boltAt(brBolts[sg.br], u);
      return boltAt(mainBolt, u);
    };

    /* синапс на конце — мягкое пятно, растворяется в ноль */
    var sr = (1.5 + vis * 3.2) * pulse * dep;
    var g = ctx.createRadialGradient(P2[0], P2[1], 0, P2[0], P2[1], sr * 3.4);
    g.addColorStop(0, 'hsla(' + hue + ',100%,82%,' + (alpha * 0.90).toFixed(3) + ')');
    g.addColorStop(1, 'hsla(' + hue + ',100%,70%,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(P2[0], P2[1], sr * 3.4, 0, 6.2832);
    ctx.fill();

    /* --- ответвления: вырастают от голоса --- */
    var bA = 0.35 + vis * 0.75;
    for (var bi = 0; bi < nn.brs.length; bi++){
      var br = nn.brs[bi];
      var s3 = qpt3(p0, c1, p2, br.at);
      var bd = brDir(br.bang, br.side, dx, dy, dz, e1x, e1y, e1z, e2x, e2y, e2z);
      var bl = L * br.len * bg;
      var bc = brCurve(s3, bd, bl, e2x, e2y, e2z, br.bend);
      var B0 = proj3(rot3(s3[0], s3[1], s3[2], cosY, sinY, ct, st), cx, cy, R);
      var B1 = proj3(rot3(bc[1][0], bc[1][1], bc[1][2], cosY, sinY, ct, st), cx, cy, R);
      var B2 = proj3(rot3(bc[0][0], bc[0][1], bc[0][2], cosY, sinY, ct, st), cx, cy, R);

      for (var k2 = 0; k2 < passes.length; k2++){
        ctx.strokeStyle = 'hsla(' + hue + ',100%,68%,' + (passes[k2][1] * bA * 0.72).toFixed(3) + ')';
        ctx.lineWidth   = passes[k2][0] * 0.72;
        ctx.beginPath();
        ctx.moveTo(B0[0], B0[1]);
        ctx.quadraticCurveTo(B1[0], B1[1], B2[0], B2[1]);
        ctx.stroke();
      }

      /* ветка второго порядка — сеть становится гуще */
      if (br.sub){
        var s3b = qpt3(s3, bc[1], bc[0], 0.55);
        var bd2 = brDir(br.bang + br.side * 1.15, br.side, dx, dy, dz, e1x, e1y, e1z, e2x, e2y, e2z);
        var bl2 = bl * 0.52;
        var bc2 = brCurve(s3b, bd2, bl2, e2x, e2y, e2z, br.bend);
        var C0 = proj3(rot3(s3b[0], s3b[1], s3b[2], cosY, sinY, ct, st), cx, cy, R);
        var C1 = proj3(rot3(bc2[1][0], bc2[1][1], bc2[1][2], cosY, sinY, ct, st), cx, cy, R);
        var C2 = proj3(rot3(bc2[0][0], bc2[0][1], bc2[0][2], cosY, sinY, ct, st), cx, cy, R);
        for (var k3 = 0; k3 < passes.length; k3++){
          ctx.strokeStyle = 'hsla(' + hue + ',100%,68%,' + (passes[k3][1] * bA * 0.55).toFixed(3) + ')';
          ctx.lineWidth   = passes[k3][0] * 0.55;
          ctx.beginPath();
          ctx.moveTo(C0[0], C0[1]);
          ctx.quadraticCurveTo(C1[0], C1[1], C2[0], C2[1]);
          ctx.stroke();
        }
      }
    }

    /* --- бегущие точки-сигналы по линиям --- */
    for (var si = 0; si < nn.sig.length; si++){
      var sg = nn.sig[si];
      sg.u += sg.sp * 0.016 * (0.55 + vis * 1.10);   // от голоса ускоряются
      if (sg.u > 1.14){ sg.u = -0.06; }              // ушла — стартует заново
      if (sg.u < 0 || sg.u > 1) continue;

      var q3  = sigPt3(sg, sg.u);
      var q30 = sigPt3(sg, Math.max(0, sg.u - 0.16));
      var Q1  = proj3(rot3(q3[0],  q3[1],  q3[2],  cosY, sinY, ct, st), cx, cy, R);
      var Q0  = proj3(rot3(q30[0], q30[1], q30[2], cosY, sinY, ct, st), cx, cy, R);
      var px = Q1[0], py = Q1[1], tx = Q0[0], ty = Q0[1];
      var sdep = 0.45 + 0.55 * ((Q1[2] + 1) * 0.5);

      /* хвост сигнала — растворяется в ноль */
      var tg = ctx.createLinearGradient(tx, ty, px, py);
      tg.addColorStop(0, 'hsla(' + hue + ',100%,75%,0)');
      tg.addColorStop(1, 'hsla(' + hue + ',100%,88%,' + (alpha * 0.55 * sdep).toFixed(3) + ')');
      ctx.strokeStyle = tg;
      ctx.lineWidth   = nn.w * ws * 1.5;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(px, py);
      ctx.stroke();

      /* сама точка — мягкое пятно, без граней */
      var dr = (1.6 + vis * 2.6) * (0.78 + 0.30 * Math.sin(t * 6 + sg.u * 9)) * sdep;
      var dg = ctx.createRadialGradient(px, py, 0, px, py, dr * 3.2);
      dg.addColorStop(0,    'hsla(' + hue + ',100%,96%,' + Math.min(1, alpha * 1.6 * sdep).toFixed(3) + ')');
      dg.addColorStop(0.35, 'hsla(' + hue + ',100%,82%,' + (alpha * 0.75 * sdep).toFixed(3) + ')');
      dg.addColorStop(1,    'hsla(' + hue + ',100%,70%,0)');
      ctx.fillStyle = dg;
      ctx.beginPath();
      ctx.arc(px, py, dr * 3.2, 0, 6.2832);
      ctx.fill();
    }
  }
}

/* ============ ЦВЕТА ПО ГЛУБИНЕ ============ */
var BUCKETS = 8;
var COLORS = [];
for (var b = 0; b < BUCKETS; b++){
  var f = b / (BUCKETS - 1);              // 0 = дальний, 1 = ближний
  var hue = 208 + f * 62;                 // синий -> фиолетово-голубой
  var lig = 42 + f * 34;
  COLORS.push('hsl(' + hue.toFixed(0) + ',100%,' + lig.toFixed(0) + '%)');
}
var bx = [], by = [], bs = [];
for (var k = 0; k < BUCKETS; k++){ bx.push([]); by.push([]); bs.push([]); }

/* ============ МИКРОФОН ============ */
var audioCtx = null, analyser = null, dataArr = null, stream = null, micOK = false;

function startMic(){
  return new Promise(function(res){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      res(false); return;
    }
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:false, autoGainControl:true}})
    .then(function(s){
      stream = s;
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      var src = audioCtx.createMediaStreamSource(s);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.75;
      src.connect(analyser);
      dataArr = new Uint8Array(analyser.fftSize);
      if (audioCtx.state === 'suspended') audioCtx.resume();
      micOK = true;
      res(true);
    })
    .catch(function(){ micOK = false; res(false); });
  });
}
function stopMic(){
  try{ if (stream) stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
  try{ if (audioCtx) audioCtx.close(); }catch(e){}
  stream = null; audioCtx = null; analyser = null; micOK = false;
}
function readLevel(){
  if (!analyser || !dataArr) return 0;
  analyser.getByteTimeDomainData(dataArr);
  var s = 0;
  for (var i = 0; i < dataArr.length; i++){
    var v = (dataArr[i] - 128) / 128;
    s += v * v;
  }
  return Math.sqrt(s / dataArr.length);
}

/* ============ СОСТОЯНИЕ ============ */
var state = 'listen';       // listen | speak
var silenceT = 0, speakT = 0;
var SILENCE_LIMIT = 5.0;    // 5 секунд тишины -> отвечает
var SPEAK_LIMIT   = 3.6;

var level = 0;              // сглаженный уровень голоса
var rotY = 0, tilt = 0.34;
var t0 = performance.now(), tPrev = t0;

var statusEl = document.getElementById('status');
var stageEl  = document.getElementById('stage');
var startEl  = document.getElementById('start');

/* ============ ЦИКЛ ============ */
function frame(now){
  var dt = Math.min((now - tPrev) / 1000, 0.05);
  tPrev = now;
  var t = (now - t0) / 1000;

  /* --- уровень --- */
  var raw = micOK ? readLevel() : 0;
  var target = Math.min(1, raw * 4.6);
  level += (target - level) * 0.28;

  /* --- логика тишины --- */
  if (state === 'listen'){
    if (level < 0.06) silenceT += dt; else silenceT = 0;
    if (silenceT > SILENCE_LIMIT){ state = 'speak'; speakT = 0; }
  } else {
    speakT += dt;
    if (speakT > SPEAK_LIMIT){ state = 'listen'; silenceT = 0; }
  }

  /* --- видимый уровень --- */
  var vis;
  if (state === 'speak'){
    vis = 0.30 + 0.22 * Math.sin(t * 7.3)
              + 0.14 * Math.sin(t * 13.1 + 1.7)
              + 0.08 * Math.sin(t * 23.7);
    vis = Math.max(0.10, vis);
  } else if (!micOK){
    vis = 0.16 + 0.10 * Math.sin(t * 2.1) + 0.06 * Math.sin(t * 4.7 + 1.1);
  } else {
    vis = level;
  }

  /* --- статус --- */
  var want = (state === 'speak') ? 'отвечаю' : 'слушаю вас';
  if (statusEl.textContent !== want) statusEl.textContent = want;
  statusEl.style.color = (state === 'speak') ? '#c9b4ff' : '#9dc4ee';

  /* --- вращение --- */
  rotY += (0.0042 + vis * 0.010) * (dt * 60);
  var ct = Math.cos(tilt), st = Math.sin(tilt);

  /* --- геометрия --- */
  var cx = W / 2, cy = H / 2;
  var R  = Math.min(W, H) * 0.30;
  var breathe = 1 + vis * 0.10 + 0.012 * Math.sin(t * 1.7);

  ctx.clearRect(0, 0, W, H);

  /* --- ореол --- */
  ctx.globalCompositeOperation = 'lighter';
  var haloSize = R * 4.2 * (1 + vis * 0.16);
  ctx.globalAlpha = 0.30 + vis * 0.35;
  ctx.drawImage(HALO, cx - haloSize/2, cy - haloSize/2, haloSize, haloSize);

  /* --- ядро: разноцветное свечение, медленно вращается --- */
  var coreSize = R * 1.35 * (1 + vis * 0.30);
  ctx.globalAlpha = 0.22 + vis * 0.55;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(t * 0.35);
  ctx.drawImage(CORE, -coreSize/2, -coreSize/2, coreSize, coreSize);
  ctx.restore();
  ctx.globalAlpha = 1;

  /* --- нейронные связи от центра шара (объёмные, в 3D) --- */
  drawNeurons(cx, cy, R, t, vis, Math.cos(rotY), Math.sin(rotY), ct, st);

  /* --- сброс корзин --- */
  for (var b2 = 0; b2 < BUCKETS; b2++){ bx[b2].length = 0; by[b2].length = 0; bs[b2].length = 0; }

  var cosY = Math.cos(rotY), sinY = Math.sin(rotY);

  for (var p = 0; p < N; p++){
    var pt = pts[p];

    /* живое колыхание радиуса */
    var wob = 1
      + vis * 0.30 * (0.40 + 0.60 * Math.sin(t * 3.1 * pt.sp + pt.ph))
      + 0.030 * Math.sin(t * 2.2 + pt.ph * 2.0)
      + 0.018 * Math.sin(t * 5.3 * pt.sp + pt.ph * 1.3);

    var rad = R * breathe * wob;

    /* поворот вокруг Y */
    var x1 =  pt.x * cosY + pt.z * sinY;
    var z1 = -pt.x * sinY + pt.z * cosY;
    var y1 =  pt.y;

    /* наклон */
    var y2 = y1 * ct - z1 * st;
    var z2 = y1 * st + z1 * ct;

    /* перспектива */
    var persp = 1 + z2 * 0.26;
    var sx = cx + x1 * rad * persp;
    var sy = cy + y2 * rad * persp;

    /* глубина: z2 от -1 (дальний) до 1 (ближний) */
    var d = (z2 + 1) * 0.5;
    if (d < 0) d = 0; else if (d > 1) d = 1;

    var bi = (d * (BUCKETS - 1)) | 0;
    var size = (0.85 + d * 1.95) * (1 + vis * 0.35);

    bx[bi].push(sx);
    by[bi].push(sy);
    bs[bi].push(size);
  }

  /* --- отрисовка точек по корзинам --- */
  for (var q = 0; q < BUCKETS; q++){
    var arr = bx[q];
    if (!arr.length) continue;
    var ay = by[q], as = bs[q];
    ctx.fillStyle = COLORS[q];
    ctx.beginPath();
    for (var m = 0; m < arr.length; m++){
      var r2 = as[m] * 0.5;
      ctx.moveTo(arr[m] + r2, ay[m]);
      ctx.arc(arr[m], ay[m], r2, 0, 6.2832);
    }
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}

/* ============ СТАРТ / СТОП ============ */
document.getElementById('micBtn').addEventListener('click', function(){
  startEl.style.display = 'none';
  stageEl.classList.add('on');
  resize();
  state = 'listen'; silenceT = 0; speakT = 0; level = 0;
  t0 = performance.now(); tPrev = t0;
  startMic();
  requestAnimationFrame(frame);
});

document.getElementById('back').addEventListener('click', function(){
  stageEl.classList.remove('on');
  startEl.style.display = 'flex';
  stopMic();
});

/* пауза/возврат — не даём канвасу обнулиться */
document.addEventListener('visibilitychange', function(){
  if (!document.hidden){ resize(); tPrev = performance.now(); }
});

})();
</script>
