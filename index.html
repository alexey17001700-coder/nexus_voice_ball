<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nexus — Живое общение</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#05060c; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }

  #start {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:38px;
    background:radial-gradient(circle at 50% 40%, #0d1430 0%, #05060c 70%);
    z-index:10; transition:opacity .45s ease;
  }
  #start h1 { color:#7fa8ff; font-size:20px; font-weight:600; letter-spacing:3px; text-transform:uppercase; opacity:.85; }
  #start p { color:#3d4a6b; font-size:13px; letter-spacing:1px; }

  .mic-btn {
    width:130px; height:130px; border-radius:50%; border:none; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #2b6bff, #0a2a8a 70%);
    box-shadow:0 0 40px rgba(43,107,255,.55), 0 0 90px rgba(43,107,255,.25), inset 0 0 30px rgba(120,180,255,.35);
    display:flex; align-items:center; justify-content:center;
    transition:transform .18s ease, box-shadow .3s ease;
    animation:pulse 2.6s ease-in-out infinite;
  }
  .mic-btn:active { transform:scale(.93); }
  .mic-btn svg { width:52px; height:52px; fill:#dce8ff; }
  @keyframes pulse {
    0%,100% { box-shadow:0 0 40px rgba(43,107,255,.55), 0 0 90px rgba(43,107,255,.25), inset 0 0 30px rgba(120,180,255,.35); }
    50%     { box-shadow:0 0 55px rgba(43,107,255,.85), 0 0 120px rgba(43,107,255,.4), inset 0 0 40px rgba(150,200,255,.5); }
  }

  #live {
    position:fixed; inset:0; z-index:20; display:none;
    background:radial-gradient(circle at 50% 45%, #0a1030 0%, #04050a 75%);
  }
  #live.show { display:block; animation:fadeIn .5s ease; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  #ball { position:absolute; inset:0; width:100%; height:100%; display:block; }

  #status {
    position:absolute; top:8%; left:0; right:0; text-align:center;
    color:#6f8fd6; font-size:14px; letter-spacing:4px; text-transform:uppercase;
    opacity:.75; pointer-events:none;
  }

  #back {
    position:absolute; bottom:38px; left:50%; transform:translateX(-50%);
    padding:14px 42px; border-radius:40px; border:1px solid rgba(110,150,255,.35);
    background:rgba(20,32,70,.55); backdrop-filter:blur(12px);
    color:#a8c2ff; font-size:15px; letter-spacing:2px; cursor:pointer;
    display:flex; align-items:center; gap:10px;
    transition:background .2s ease, transform .15s ease;
  }
  #back:active { transform:translateX(-50%) scale(.95); background:rgba(30,48,100,.8); }
  #back svg { width:18px; height:18px; fill:#a8c2ff; }

  #hint {
    position:absolute; bottom:110px; left:0; right:0; text-align:center;
    color:#3a4a72; font-size:12px; letter-spacing:1px;
  }
</style>
</head>
<body>

<div id="start">
  <h1>Nexus</h1>
  <button class="mic-btn" id="micStart" aria-label="Живое общение">
    <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
  </button>
  <p>нажми микрофон — живое общение</p>
</div>

<div id="live">
  <canvas id="ball"></canvas>
  <div id="status">слушаю</div>
  <div id="hint">говори — шар ждёт 5 секунд, потом отвечает</div>
  <button id="back">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    назад
  </button>
</div>

<script>
/* ================= КАНВАС ================= */
const canvas = document.getElementById('ball');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
let W = 0, H = 0, DPR = 1;

/* --- спрайты (рисуем один раз, потом только drawImage — быстро) --- */
function makeSprite(size, stops) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  for (const s of stops) grd.addColorStop(s[0], s[1]);
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  return c;
}

let spGlow, spShell, spCore, spFog = [];

function buildSprites() {
  spGlow = makeSprite(256, [
    [0,   'rgba(70,130,255,1)'],
    [0.5, 'rgba(40,80,200,0.42)'],
    [1,   'rgba(0,0,0,0)']
  ]);
  spShell = makeSprite(256, [
    [0,    'rgba(205,228,255,0.10)'],
    [0.70, 'rgba(90,150,255,0.05)'],
    [0.92, 'rgba(165,205,255,0.18)'],
    [1,    'rgba(120,170,255,0)']
  ]);
  spCore = makeSprite(256, [
    [0, 'rgba(180,215,255,1)'],
    [1, 'rgba(60,120,255,0)']
  ]);
  spFog = [
    makeSprite(256, [[0,'rgba(110,170,255,0.95)'],[1,'rgba(110,170,255,0)']]),
    makeSprite(256, [[0,'rgba(120,220,255,0.95)'],[1,'rgba(120,220,255,0)']]),
    makeSprite(256, [[0,'rgba(170,140,255,0.95)'],[1,'rgba(170,140,255,0)']])
  ];
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth || window.innerWidth;
  H = canvas.clientHeight || window.innerHeight;
  canvas.width  = Math.max(1, Math.round(W * DPR));
  canvas.height = Math.max(1, Math.round(H * DPR));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildSprites();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

/* --- точки на сфере (спираль Фибоначчи) --- */
const N = 820;
const pts = [];
const GA = Math.PI * (3 - Math.sqrt(5));
for (let i = 0; i < N; i++) {
  const y = 1 - (i / (N - 1)) * 2;
  const r = Math.sqrt(Math.max(0, 1 - y * y));
  const th = GA * i;
  pts.push({ x: Math.cos(th) * r, y: y, z: Math.sin(th) * r });
}

/* --- аудио --- */
let analyser = null, dataArr = null, audioCtx = null, stream = null;
let smoothLevel = 0, state = 'idle';

async function startMic() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true }
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.75;
    src.connect(analyser);
    dataArr = new Uint8Array(analyser.frequencyBinCount);
  } catch (e) {
    analyser = null;   // нет микрофона — шар живёт в демо-режиме
  }
}

function readLevel() {
  if (!analyser) return 0;
  analyser.getByteFrequencyData(dataArr);
  let sum = 0;
  for (let i = 0; i < dataArr.length; i++) sum += dataArr[i];
  return Math.min(1, (sum / dataArr.length) / 85);
}

/* ================= РЕНДЕР ================= */
let t = 0, rotY = 0, rotX = 0, lastVoice = 0;
const SILENCE_WAIT = 5;

/* корзины по цвету и глубине — вместо 820 отдельных заливок */
const HB = 14, DB = 4;
const buckets = [];
for (let i = 0; i < HB * DB; i++) buckets.push([]);

function render() {
  requestAnimationFrame(render);
  if (!W || !H) return;
  t += 0.016;

  const raw = readLevel();
  smoothLevel += (raw - smoothLevel) * 0.18;

  let drive;
  if (smoothLevel > 0.06) {
    lastVoice = t;
    state = 'listen';
    drive = smoothLevel;
  } else {
    const silence = t - lastVoice;
    if (silence < SILENCE_WAIT) {
      state = 'listen';
      drive = 0.06 + Math.sin(t * 1.6) * 0.035;          // спокойно дышит, ждёт
    } else {
      state = 'speak';
      const fake = (Math.sin(t * 2.2) * 0.5 + 0.5) * 0.30 + Math.sin(t * 5.7) * 0.06;
      drive = Math.max(0.02, fake);                       // имитация голоса ИИ
    }
  }
  if (drive < 0) drive = 0;

  statusEl.textContent = state === 'listen' ? 'слушаю вас' : 'отвечаю';

  rotY += 0.004 + drive * 0.02;
  rotX = Math.sin(t * 0.35) * 0.35;

  const cx = W / 2, cy = H / 2;
  const baseR = Math.min(W, H) * 0.24;
  const R = baseR * (1 + drive * 0.42);

  ctx.clearRect(0, 0, W, H);

  /* свечение позади */
  const gInt = 0.10 + drive * 0.30;
  ctx.globalAlpha = gInt;
  ctx.drawImage(spGlow, cx - R * 2.4, cy - R * 2.4, R * 4.8, R * 4.8);
  ctx.globalAlpha = 1;

  /* проекция точек */
  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  const focal = 3.2;

  for (let i = 0; i < buckets.length; i++) buckets[i].length = 0;

  for (let i = 0; i < N; i++) {
    const p = pts[i];
    const ph = i * 0.35;
    const wob = 1
      + 0.050 * Math.sin(t * 1.4 + ph)
      + 0.032 * Math.sin(t * 2.3 + ph * 1.7)
      + drive * 0.80 * Math.sin(t * 7.5 + ph)
      + drive * 0.42 * Math.sin(t * 13.0 + ph * 2.3)
      + drive * 0.20 * Math.sin(t * 21.0 + ph * 3.1);

    const x = p.x * wob, y = p.y * wob, z = p.z * wob;

    const x1 = x * cosY - z * sinY;
    const z1 = x * sinY + z * cosY;
    const y1 = y * cosX - z1 * sinX;
    const z2 = y * sinX + z1 * cosX;

    const scale = focal / (focal + z2);
    const X = cx + x1 * R * scale;
    const Y = cy + y1 * R * scale;

    let depth = 1 - (z2 + 1) / 2;
    if (depth < 0) depth = 0; else if (depth > 1) depth = 1;

    let hue = 205 + Math.sin(t * 0.55 + depth * 1.4 + i * 0.004) * 60 + drive * 45;
    hue = ((hue % 360) + 360) % 360;

    const hb = Math.min(HB - 1, Math.floor(hue / 360 * HB));
    const db = Math.min(DB - 1, Math.floor(depth * DB));
    buckets[hb * DB + db].push(X, Y);
  }

  /* рисуем корзинами — быстро и без сортировки */
  for (let hb = 0; hb < HB; hb++) {
    for (let db = 0; db < DB; db++) {
      const arr = buckets[hb * DB + db];
      if (!arr.length) continue;

      const depth = (db + 0.5) / DB;
      const hue = (hb + 0.5) / HB * 360;
      const alpha = 0.13 + depth * 0.72;
      const light = 50 + depth * 30 + drive * 14;
      const size = (0.75 + depth * 1.85) * (1 + drive * 0.5);

      ctx.fillStyle = `hsla(${hue.toFixed(0)}, 100%, ${light.toFixed(0)}%, ${alpha.toFixed(3)})`;
      ctx.beginPath();
      for (let k = 0; k < arr.length; k += 2) {
        ctx.moveTo(arr[k] + size, arr[k + 1]);
        ctx.arc(arr[k], arr[k + 1], size, 0, 6.2832);
      }
      ctx.fill();
    }
  }

  /* туман внутри пузыря */
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let f = 0; f < 6; f++) {
    const a = t * (0.22 + f * 0.06) + f * 1.9;
    const fx = cx + Math.cos(a) * R * 0.42;
    const fy = cy + Math.sin(a * 1.3 + f) * R * 0.42;
    const fr = R * (0.70 + 0.28 * Math.sin(t * 0.8 + f * 1.4));
    ctx.globalAlpha = 0.10 + drive * 0.14;
    ctx.drawImage(spFog[f % 3], fx - fr, fy - fr, fr * 2, fr * 2);
  }
  ctx.restore();

  /* оболочка пузыря */
  ctx.globalAlpha = 1;
  ctx.drawImage(spShell, cx - R * 1.14, cy - R * 1.14, R * 2.28, R * 2.28);

  /* блик */
  ctx.strokeStyle = `rgba(195,225,255,${(0.10 + drive * 0.14).toFixed(3)})`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 1.07, Math.PI * 0.72, Math.PI * 1.58);
  ctx.stroke();

  /* ядро */
  ctx.globalAlpha = 0.35 + drive * 0.40;
  ctx.drawImage(spCore, cx - R * 0.55, cy - R * 0.55, R * 1.1, R * 1.1);
  ctx.globalAlpha = 1;
}

/* ================= ЭКРАНЫ ================= */
const startEl = document.getElementById('start');
const liveEl = document.getElementById('live');

document.getElementById('micStart').addEventListener('click', async () => {
  await startMic();
  if (audioCtx && audioCtx.state === 'suspended') { try { await audioCtx.resume(); } catch (e) {} }
  startEl.style.opacity = '0';
  setTimeout(() => { startEl.style.display = 'none'; }, 450);
  liveEl.classList.add('show');
  t = 0; lastVoice = 0; smoothLevel = 0;
  requestAnimationFrame(() => resize());
});

document.getElementById('back').addEventListener('click', () => {
  liveEl.classList.remove('show');
  startEl.style.display = 'flex';
  requestAnimationFrame(() => { startEl.style.opacity = '1'; });
  if (stream) { stream.getTracks().forEach(tr => tr.stop()); stream = null; }
  if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; analyser = null; }
});

resize();
render();
</script>
</body>
</html>
